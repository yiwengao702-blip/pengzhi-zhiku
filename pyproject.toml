# ============================================================
# 鹏至智库 · 企业级智能知识库 RAG 项目依赖配置
# 包管理器：uv（推荐） / 兼容 pip（见 requirements.txt）
# Python 要求：>=3.11
# ------------------------------------------------------------
# 说明：
#   1. `config` / `processor` / `utils` / `tool` / `web` 是本项目
#      自身的本地包（源码目录），【不要】作为 PyPI 外部依赖安装，
#      运行时需保证项目根目录在 PYTHONPATH（直接于根目录执行即可）。
#   2. 以下依赖均经过全仓库 import 审计 + .venv 实际版本核对，
#      去除了未使用的包（grandalf / torchvision / torchaudio 等），
#      并补全了漏配的包（requests / pydantic / langchain-core）。
#   3. torch 强制从 NVIDIA CUDA 源安装 cu128 版本以启用 GPU。
# ============================================================

[project]
name = "knowledge-base"
version = "0.1.0"
description = "企业级智能知识库 RAG：文档导入（PDF/MD）→ 向量化 → 混合检索 → 大模型问答"
requires-python = ">=3.11"
dependencies = [
    # ===== Web 服务 & 运行入口 =====
    "fastapi>=0.138.0",          # Web API 框架（web/api/*）
    "uvicorn[standard]>=0.51.0", # ASGI 服务器（__main__ 启动）
    "pydantic>=2.13.4",          # 请求/响应数据模型（query_service 等）
    "python-dotenv>=1.2.2",      # 读取 .env 配置（config/*、config_base.py）
    "colorlog>=6.10.1",          # 彩色日志（tool/logger.py、base.py）
    "requests>=2.34.2",          # HTTP 客户端（MinerU 转换服务、联网请求）

    # ===== 大模型 / Agent 编排 =====
    "langchain-openai>=1.3.2",   # ChatOpenAI 调用 LLM（llm_utils、识别节点）
    "langchain-text-splitters>=1.1.2", # 文档切分（node_document_split）
    "langchain-core>=1.4.8",     # SystemMessage/HumanMessage（各节点直接 import）
    "langgraph>=1.2.6",          # StateGraph 工作流编排（main_graph）
    "openai-agents>=0.18.3",     # agents.mcp 联网搜索（node_web_search_mcp）

    # ===== 向量库 / 数据库 / 对象存储 =====
    "pymilvus[model]>=3.0.0",    # 向量库 + BGEM3 嵌入函数（embedding/milvus_utils）
    "pymongo>=4.17.0",           # 对话历史存储（mongo_history_utils；bson 随附）
    "minio>=7.2.20",             # 对象存储（minio_utils、图片节点）

    # ===== 嵌入 / 重排序 模型栈（BGE-M3 等）=====
    "flagembedding>=1.4.0",      # BGE-M3 嵌入（由 pymilvus[model] 引入，运行依赖）
    "transformers>=4.45.0,<5.0.0", # flagembedding 底层依赖（BGE 模型加载）
    "modelscope>=1.38.1",        # 模型下载/离线缓存（.env 中 MODELSCOPE_OFFLINE）
    "torch>=2.11.0",             # 深度学习后端（flagembedding/transformers，GPU cu128）

    # ===== 阿里云 DashScope =====
    "dashscope>=1.26.4",         # 文本重排序服务（reranker_http_utils）
]

[tool.uv.sources]
# 强制从 NVIDIA CUDA 源安装 GPU 版 torch
torch = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
