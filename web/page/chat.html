  <script>
  /* 主题防闪烁：在 <body> 绘制前根据 localStorage 预设 data-theme */
  (function(){
    var STORE='kb_theme';
    function getTheme(){ return document.documentElement.getAttribute('data-theme')==='dark' ? 'dark' : 'light'; }
    function setTheme(t){
      if(t==='dark') document.documentElement.setAttribute('data-theme','dark');
      else document.documentElement.removeAttribute('data-theme');
      try{ localStorage.setItem(STORE,t); }catch(e){}
    }
    /* 防闪烁：首屏即按上次偏好渲染，避免浅色/深色切换瞬间白闪 */
    try{ if(localStorage.getItem(STORE)==='dark') document.documentElement.setAttribute('data-theme','dark'); }catch(e){}
    /* 单一切换函数：每次单击读取当前状态后取反，保证「单击即切换、绝不双击抵消」 */
    function toggleTheme(){ setTheme(getTheme()==='dark' ? 'light' : 'dark'); }
    document.addEventListener('DOMContentLoaded',function(){
      var b=document.getElementById('themeToggle');
      if(b){
        /* 整个按钮均为点击热区（SVG 已设 pointer-events:none），无内部死区 */
        b.addEventListener('click', function(e){ e.preventDefault(); toggleTheme(); });
        /* 键盘可达：Enter / 空格也能一键切换 */
        b.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleTheme(); } });
      }
    });
    /* 暴露全局，避免重复绑定，也便于其它脚本复用 */
    window.__toggleTheme = toggleTheme;
  })();
  </script>

    function scrollToBottom(){
      chatEl.scrollTop = chatEl.scrollHeight;
    }
    function nowTime(){
      const d = new Date();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function formatTime(ts){
      if(!ts) return nowTime();
      const d = new Date(Number(ts) * 1000);
      if(Number.isNaN(d.getTime())) return nowTime();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    function isImageUrl(url){
      // 增加宽松度，有些 url 可能后面跟了奇怪的参数
      // 只要包含 .jpg .png 等扩展名，且后面是 ? # 或 结束，或者被某些标点截断前
      // 简单判断：路径部分以图片后缀结尾
      try {
        const u = new URL(url);
        return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname);
      } catch (e) {
        // 如果 new URL 失败（比如相对路径或非法字符），退回正则匹配
        return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || '');
      }
    }

    function normalizeUrl(rawUrl){
      const s = String(rawUrl || '').trim();
      if(!s) return '';
      // 尽量保留原始 URL，但把空格编码，避免 img src 失败
      return s.replace(/\s/g, '%20');
    }

    function dedupeKeepOrder(arr){
      const seen = new Set();
      const out = [];
      for(const x of (Array.isArray(arr) ? arr : [])){
        const v = String(x || '');
        if(!v) continue;
        if(seen.has(v)) continue;
        seen.add(v);
        out.push(v);
      }
      return out;
    }

    function extractUrlsLoose(text){
      const s = String(text || '');
      // 简单正则提取：匹配 http/https 开头，直到遇到空白字符
      // [^\s] 包含中文、特殊符号等，直到遇到换行或空格
      const regex = /(https?:\/\/[^\s]+)/g;
      const matches = s.match(regex) || [];
      const urls = [];
      
      // 去除首尾标点
      const trimTailPunct = (u) => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
      const trimHeadPunct = (u) => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');

      for(const m of matches){
        let u = trimHeadPunct(trimTailPunct(m));
        // 简单清洗可能混入的结尾
        if(u) urls.push(u);
      }
      return dedupeKeepOrder(urls);
    }

    function parseImagesFromTextLoosely(text){
      const urls = extractUrlsLoose(text).filter(isImageUrl);
      return dedupeKeepOrder(urls);
    }

    function findLastImageMarkerIndex(raw){
      const s = String(raw || '');
      // 支持多种写法：【图片】、【 图片 】、[图片]、[ 图片 ]
      const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
      let m;
      let lastIdx = -1;
      let lastLen = 0;
      while((m = re.exec(s)) !== null){
        lastIdx = m.index;
        lastLen = m[0].length;
      }
      return { idx: lastIdx, len: lastLen };
    }

    function parseAnswerAndImages(text){
      const raw = String(text || '');
      const { idx, len } = findLastImageMarkerIndex(raw);
      if(idx === -1) return { text: raw, images: [] };

      const before = raw.slice(0, idx).trimEnd();
      const after = raw.slice(idx + len).trim();
      const urls = [];

      // 优先按“每行一个 URL”的方式解析，允许 URL 中包含空格
      const lines = after.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      for(const line of lines){
        if(line.startsWith('http://') || line.startsWith('https://')){
          urls.push(line);
        }else{
          // 兼容同一行包含多个 URL 的情况
          const matches = extractUrlsLoose(line);
          for(const u of matches){
            urls.push(u);
          }
        }
      }

      // 去重保序 + 过滤图片链接
      const seen = new Set();
      const images = [];
      for(const u of urls){
        const normalized = normalizeUrl(u);
        if(!isImageUrl(normalized)) continue;
        if(seen.has(normalized)) continue;
        seen.add(normalized);
        images.push(normalized);
      }
      return { text: before, images };
    }

    function shouldShowImagesByAnswer(answerText){
      const t = String(answerText || '');
      // 常见“需要看图/见图/如下图”的表述
      const keywords = [
        '如图', '如下图', '见图', '见下图', '下图', '上图',
        '图片', '示意图', '结构图', '外观', '接线图', '电路图', '原理图', '安装图', '尺寸图', '截图'
      ];
      return keywords.some(k => t.includes(k));
    }

    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls){
      const { text, images: imagesFromBlock } = parseAnswerAndImages(answerText);
      const candidates = Array.isArray(candidateImageUrls)
        ? candidateImageUrls.map(normalizeUrl).filter(isImageUrl)
        : [];
      const hasBlockImages = imagesFromBlock && imagesFromBlock.length > 0;
      
      // 使用宽松提取
      const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);
      
      // 只要后端给了候选图片，就展示（避免答案没写“如图”但用户仍需要看图）
      // 或者从文本里提取到了图片 URL
      const shouldShow = hasBlockImages || (candidates.length > 0) || (looseImages.length > 0);
      
      // 优先级：Block 显式标记 > 后端候选 > 文本宽松提取
      // 注意：这里做个并集可能更好，防止漏掉
      const allImages = new Set([
          ...(hasBlockImages ? imagesFromBlock : []),
          ...candidates,
          ...looseImages
      ]);
      const images = Array.from(allImages);

      containerEl.textContent = '';

      if((text || '').trim().length > 0){
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.textContent = text;
        containerEl.appendChild(textEl);
      }else{
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.textContent = '（已完成，但未返回答案）';
        containerEl.appendChild(textEl);
      }

      if(images && images.length > 0){
        const imgWrap = document.createElement('div');
        imgWrap.className = 'answer-images';
        for(const url of images){
          const safeUrl = normalizeUrl(url);
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.src = safeUrl;
          img.alt = '参考图片';
          img.referrerPolicy = 'no-referrer';
          img.addEventListener('error', () => {
            img.style.display = 'none';
          });
          imgWrap.appendChild(img);

          const link = document.createElement('a');
          link.href = safeUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = url;
          imgWrap.appendChild(link);
        }
        containerEl.appendChild(imgWrap);
      }
    }

    function renderProgress(botMsgEl, doneList, runningList, status){
      const details = botMsgEl.querySelector('details.progress');
      const summary = details.querySelector('summary');
      const ul = details.querySelector('ul');
      const done = Array.isArray(doneList) ? doneList : [];
      const running = Array.isArray(runningList) ? runningList : [];
      const totalDone = done.length;
      const totalRun = running.length;

      const statusMap = {
        'processing': '处理中',
        'completed': '已完成',
        'failed': '失败',
        'pending': '等待中',
      };
      const displayStatus = statusMap[status] || status || 'unknown';

      summary.textContent = `阶段进度（已完成${totalDone}，进行中${totalRun}，状态：${displayStatus}）`;

      const lines = [
        ...done.map(x => `✅ ${x}`),
        ...running.map(x => `⏳ ${x}`)
      ];
      ul.innerHTML = '';
      if(lines.length === 0){
        ul.insertAdjacentHTML('beforeend', '<li>暂无进度</li>');
      }else{
        for(const line of lines){
          ul.insertAdjacentHTML('beforeend', `<li>${escapeHtml(line)}</li>`);
        }
      }
    }

    function finalizeBotAnswer(botMsgEl, answer, error, imageUrls){
      const bubble = botMsgEl.querySelector('.bubble');
      const progress = botMsgEl.querySelector('details.progress');
      const err = (error || '').trim();

      if(err){
        const progressEl = progress ? progress : null;
        if(progressEl) {
            progressEl.remove();
            progressEl.removeAttribute('open');
        }
        bubble.textContent = '';
        const errEl = document.createElement('div');
        errEl.className = 'answer';
        errEl.textContent = `抱歉，本次处理失败：\n${err}`;
        bubble.appendChild(errEl);
        if(progressEl) bubble.appendChild(progressEl);
        return;
      }

      const progressEl = progress ? progress : null;
      if(progressEl) {
        progressEl.remove();
        progressEl.removeAttribute('open'); // 完成后自动收起
      }
      bubble.textContent = '';
      const answerEl = document.createElement('div');
      answerEl.className = 'answer';
      bubble.appendChild(answerEl);
      renderAnswerWithImages(answerEl, answer || '', imageUrls || []);
      if(progressEl) bubble.appendChild(progressEl);
    }

    // 检索遥测侧栏：把本次 meta 渲染进右侧面板（信息呈现方式差异化，独立于气泡内联指标行）
    // 与气泡内的 .answer-stats 行形成「内联速览 + 面板遥测」双视图，避免与其它页雷同
    // recentMetas：会话内累计的检索指标序列，用于绘制「耗时趋势」迷你柱图（刷新后由历史恢复填充）
    const recentMetas = [];
    const RAIL_TREND_MAX = 10; // 趋势图最多展示最近 N 次检索

    // 构建耗时趋势迷你柱图 HTML（数据不足 2 条时返回空，避免无效装饰）
    function buildRailTrendHtml(){
      if(recentMetas.length < 2) return '';
      // 仅取最近 RAIL_TREND_MAX 条，按时间正序展示
      const slice = recentMetas.slice(-RAIL_TREND_MAX);
      const vals = slice.map(m => Number(m.total_ms || 0));
      const max = Math.max.apply(null, vals) || 1;
      let bars = '';
      for(const m of slice){
        const total = Number(m.total_ms || 0);
        const h = Math.max(6, Math.round((total / max) * 100)); // 最小高度 6% 保证可见
        let cls = 'rail-trend__bar';
        if(m.retrieved && !m.hit) cls += (m.recall_count > 0) ? ' rail-trend__bar--warn' : ' rail-trend__bar--bad';
        bars += `<div class="${cls}"><div class="rail-trend__fill" style="height:${h}%"></div></div>`;
      }
      const avg = Math.round(vals.reduce((a,b)=>a+b,0) / vals.length);
      return `<div class="rail-trend">
        <div class="rail-trend__hd"><span>检索耗时趋势</span><b>近 ${slice.length} 次 · 均 ${(avg/1000).toFixed(2)}s</b></div>
        <div class="rail-trend__bars">${bars}</div>
        <div class="rail-trend__x"><span>早</span><span>近</span></div>
      </div>`;
    }

    function renderRailMeta(meta){
      const railBody = document.getElementById('railBody');
      if(!railBody || !meta || typeof meta !== 'object') return;
      const secs = (ms) => (Number(ms || 0) / 1000).toFixed(2) + 's';

      // 命中状态 → 三态配色（ok / warn / idle），与 chat.css 的 .rail-status--* 一一对应
      let statusCls = 'rail-status--idle', statusText = '未检索';
      if(meta.retrieved){
        if(meta.hit){ statusCls = 'rail-status--ok'; statusText = '✅ 命中'; }
        else if(meta.recall_count > 0){ statusCls = 'rail-status--warn'; statusText = '⚠️ 相关度不足 · 已拒答'; }
        else { statusCls = 'rail-status--warn'; statusText = '❌ 未命中'; }
      }

      const rows = [];
      if(meta.retrieved){
        rows.push(['检索耗时', secs(meta.search_ms)]);
        if(meta.rrf_ms) rows.push(['融合耗时', secs(meta.rrf_ms)]);
        if(meta.rerank_ms) rows.push(['重排耗时', secs(meta.rerank_ms)]);
        rows.push(['召回数', String(meta.recall_count != null ? meta.recall_count : 0) + ' 条']);
        if(meta.top_score != null) rows.push(['最高相关度', Number(meta.top_score).toFixed(2)]);
      }
      if(meta.llm_ms) rows.push(['生成耗时', secs(meta.llm_ms)]);
      if(meta.total_ms) rows.push(['总耗时', secs(meta.total_ms)]);

      // 累计到会话序列并裁剪，供趋势图使用（每条指标都会推进一次，刷新后由历史重放填充）
      recentMetas.push({
        total_ms: meta.total_ms || 0,
        retrieved: !!meta.retrieved,
        hit: !!meta.hit,
        recall_count: meta.recall_count || 0
      });
      if(recentMetas.length > RAIL_TREND_MAX * 2) recentMetas.shift();

      let html = `<div class="rail-status ${statusCls}">${escapeHtml(statusText)}</div>`;
      for(const [k, v] of rows){
        html += `<div class="rail-row"><span class="rail-k">${escapeHtml(k)}</span><span class="rail-v">${escapeHtml(v)}</span></div>`;
      }
      // 趋势图追加在指标行之后（仅 recentMetas 足够时渲染）
      html += buildRailTrendHtml();
      railBody.innerHTML = html;
    }

    // 检索指标行：展示本次问答的检索速度 / 召回数 / 最高相关度 / 命中状态
    // 数据来自后端 meta 事件（流式）或 /query 响应的 meta 字段（非流式）
    function renderAnswerStats(botMsgEl, meta){
      if(!botMsgEl || !meta || typeof meta !== 'object') return;
      const bubble = botMsgEl.querySelector('.bubble');
      if(!bubble) return;
      const holder = bubble.parentNode;
      if(holder.querySelector('.answer-stats')) return; // 已渲染过则跳过
      const secs = (ms) => (Number(ms || 0) / 1000).toFixed(2) + 's';
      const parts = [];
      if(meta.retrieved){
        parts.push('⚡ 检索 ' + secs(meta.search_ms));
        if(meta.rrf_ms) parts.push('融合 ' + secs(meta.rrf_ms));
        if(meta.rerank_ms) parts.push('重排 ' + secs(meta.rerank_ms));
        parts.push('召回 ' + (meta.recall_count != null ? meta.recall_count : 0) + ' 条');
        if(meta.top_score != null) parts.push('最高相关度 ' + Number(meta.top_score).toFixed(2));
        parts.push(meta.hit ? '✅ 命中' : (meta.recall_count > 0 ? '⚠️ 相关度不足，已拒答' : '❌ 未命中'));
      }else{
        parts.push('未进入检索 · 主体确认阶段直接答复');
      }
      if(meta.llm_ms) parts.push('生成 ' + secs(meta.llm_ms));
      if(meta.total_ms) parts.push('总耗时 ' + secs(meta.total_ms));
      const el = document.createElement('div');
      el.className = 'answer-stats';
      el.textContent = parts.join(' · ');
      // 插到气泡之后、时间戳之前
      holder.insertBefore(el, holder.querySelector('.meta'));
      // 同步渲染到右侧检索遥测侧栏（独立于气泡，形成差异化信息呈现）
      renderRailMeta(meta);
      scrollToBottom();
    }

    async function apiHealth(){
      try{
        const res = await fetch(`${API_BASE}/health`);
        if(!res.ok) throw new Error('health not ok');
        apiPill.textContent = `API: 已连接`;
      }catch(e){
        apiPill.textContent = `API: 未连接`;
      }
    }

    async function loadHistory(){
      try{
        const res = await fetch(`${API_BASE}/history/${sessionId}`);
        if(!res.ok) return;
        const data = await res.json();
        const items = Array.isArray(data.items) ? data.items : [];
        if(items.length === 0) return;
        // 保留首条欢迎消息，其余先清空再渲染历史
        const nodes = Array.from(chatEl.querySelectorAll('.msg'));
        for(let i=1;i<nodes.length;i++) nodes[i].remove();
        for(const item of items){
          if(item.role === 'user'){
            addUserMsgWithTime(item.text || '', item.ts);
          }else{
            addBotMsgWithTime(item.text || '', item.ts, item.image_urls || [], item.meta);
          }
        }
        scrollToBottom();
      }catch(_){}
    }

    async function submitQuery(text){
      const isStream = streamToggle.checked;
      const res = await fetch(`${API_BASE}/query`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          query: text,
          session_id: sessionId,
          is_stream: isStream
        })
      });
      if(!res.ok){
        const msg = await res.text();
        throw new Error(msg || '请求失败');
      }
      return await res.json();
    }

    async function poll(taskId, botMsgEl){
      const typing = botMsgEl.querySelector('.typing');
      const interval = setInterval(async () => {
        try{
          const res = await fetch(`${API_BASE}/status/${taskId}`);
          const data = await res.json();
          renderProgress(botMsgEl, data.done_list, data.running_list, data.status);

          if(data.status === 'completed'){
            if(typing) typing.remove();
            finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
            clearInterval(interval);
            sendBtn.disabled = false;
          }else if(data.status === 'failed'){
            if(typing) typing.remove();
            finalizeBotAnswer(botMsgEl, data.answer, data.error || 'failed', data.image_urls || []);
            clearInterval(interval);
            sendBtn.disabled = false;
          }
        }catch(e){
          // 轮询错误不立刻终止，让用户稍后重试
        }
      }, 1200);
    }

    async function onSend(){
      console.log('[perf] A onSend start', performance.now());
      const text = (inputEl.value || '').trim();
      if(!text) return;
      inputEl.value = '';
      autoGrow();
      addUserMsg(text);
      const botMsgEl = addBotMsgSkeleton();
      sendBtn.disabled = true;
      // 同步当前会话 ID 到检索遥测侧栏底部
      const railSession = document.getElementById('railSession');
      if(railSession) railSession.textContent = sessionId;

      try{
        const isStream = streamToggle.checked;
        console.log('[perf] B submitQuery start', performance.now(), { isStream });
        const data = await submitQuery(text);
        console.log('[perf] B submitQuery end', performance.now(), data);
        
        // 渲染初始状态
        renderProgress(botMsgEl, [], [], 'pending');

        if (!isStream) {
          // 非流式：直接拿到结果
          // data: { session_id, answer, done_list, error, message }
          renderProgress(botMsgEl, data.done_list || [], [], 'completed');
          finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
          renderAnswerStats(botMsgEl, data.meta);
          sendBtn.disabled = false;
          return;
        }

        // 流式：SSE
        const { session_id } = data; // 此时 backend 返回 session_id
        
        const bubble = botMsgEl.querySelector('.bubble');
        let answerEl = bubble.querySelector('.answer');
        if(!answerEl){
          answerEl = document.createElement('div');
          answerEl.className = 'answer';
          bubble.insertBefore(answerEl, bubble.firstChild);
        }

        const es = new EventSource(`${API_BASE}/stream/${session_id}`);
        console.log('[perf] C EventSource created', performance.now(), { session_id });
        let rawAnswerText = '';

        // final 之后不立刻关闭 SSE：后端 meta（检索指标）紧随 final 到达，
        // 这里延迟 1.5s 收口兜底；meta 一到立即关闭，避免连接悬挂
        let closeTimer = null;
        function scheduleClose(){
          if(closeTimer) clearTimeout(closeTimer);
          closeTimer = setTimeout(() => { es.close(); }, 1500);
        }

        // 检索指标事件：渲染速度/召回/相关度/命中行，并立即收口 SSE 连接
        es.addEventListener('meta', (e) => {
          try{ renderAnswerStats(botMsgEl, JSON.parse(e.data || '{}')); }catch(_){}
          if(closeTimer){ clearTimeout(closeTimer); closeTimer = null; }
          es.close();
        });

        es.addEventListener('progress', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            renderProgress(botMsgEl, d.done_list, d.running_list, d.status);
            // 当进度状态已完成时，提前结束“...”等待态
            if(d && d.status === 'completed'){
              const typing = botMsgEl.querySelector('.typing');
              if(typing) typing.remove();
              // 防止后端未发送 final 导致按钮一直禁用
              sendBtn.disabled = false;
            }
          }catch(_){}
        });

        es.addEventListener('delta', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            const delta = d.delta || '';
            if(delta){
              rawAnswerText += delta;
              // 即使后端未发送 final，也尽可能在流式过程中渲染图片
              renderAnswerWithImages(answerEl, rawAnswerText, []);
              scrollToBottom();
            }
          }catch(_){}
        });

        es.addEventListener('final', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          // 收起进度条
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');
          
          try{
            const d = JSON.parse(e.data || '{}');
            // 流式 delta 可能不包含“【图片】/图片列表”，最终包的 d.answer 才是完整答案；优先使用 d.answer
            const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
          }catch(_){}
          scheduleClose();
          sendBtn.disabled = false;
        });

        es.addEventListener('final_answer', (e) => {
           // 响应用户的 final_answer 信号，确保图片渲染
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');
          
          try{
            const d = JSON.parse(e.data || '{}');
            const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
          }catch(_){}
          scheduleClose();
          sendBtn.disabled = false;
        });

        es.addEventListener('error', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          // 收起进度条
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');

          try{
            const msg = e && e.data ? (JSON.parse(e.data).error || 'SSE 连接中断/失败') : 'SSE 连接中断/失败';
            rawAnswerText += `\n\n（错误：${msg}）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }catch(_){
            rawAnswerText += `\n\n（错误：SSE 连接中断/失败）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }
          es.close();
          sendBtn.disabled = false;
        });
      }catch(e){
        const bubble = botMsgEl.querySelector('.bubble');
        const progress = botMsgEl.querySelector('details.progress');
        const typing = botMsgEl.querySelector('.typing');
        if(typing) typing.remove();
        bubble.innerHTML = `请求失败：${escapeHtml(e.message || e)}\n\n` + progress.outerHTML;
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', onSend);
    inputEl.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        onSend();
      }
    });

    // 答案复制：事件委托，点击气泡右上角“复制”按钮时，复制该条机器人答案的纯文本
    function copyText(text){
      if(navigator.clipboard && navigator.clipboard.writeText){
        return navigator.clipboard.writeText(text);
      }
      // 兜底方案：临时 textarea + execCommand
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand('copy'); }catch(_){}
      document.body.removeChild(ta);
      return Promise.resolve();
    }
    function flashCopy(btn, label, ok){
      const old = btn.textContent;
      btn.textContent = label;
      if(ok) btn.classList.add('is-done');
      setTimeout(() => { btn.textContent = old; btn.classList.remove('is-done'); }, 1400);
    }
    chatEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.bubble-copy');
      if(!btn) return;
      const msg = btn.closest('.msg.bot');
      if(!msg) return;
      const answerEl = msg.querySelector('.answer');
      const txtEl = answerEl ? answerEl.querySelector('.answer-text') : null;
      const txt = (txtEl ? txtEl.textContent : '').trim();
      if(!txt || txt === '（已完成，但未返回答案）'){
        flashCopy(btn, '暂无可复制内容', false);
        return;
      }
      copyText(txt)
        .then(() => flashCopy(btn, '已复制', true))
        .catch(() => flashCopy(btn, '复制失败', false));
    });

    // 输入框随内容自适应增高（封顶 160px 后内部滚动），发送后复位高度
    function autoGrow(){ inputEl.style.height='auto'; inputEl.style.height=Math.min(inputEl.scrollHeight,160)+'px'; }
    inputEl.addEventListener('input', autoGrow);
    autoGrow();
    btnClear.addEventListener('click', async () => {
      if(!confirm('确定要清空当前会话的历史记录吗？这将无法恢复。')) return;

      try {
        const res = await fetch(`${API_BASE}/history/${sessionId}`, { method: 'DELETE' });
        if(!res.ok) {
           console.error("Failed to clear history backend, status:", res.status);
           alert('服务端清空失败，仅清空本地显示');
        }
      } catch(e) {
        console.error("Failed to clear history backend", e);
        alert('服务端清空失败，仅清空本地显示');
      }

      // 清空除首条欢迎消息外的内容
      const nodes = Array.from(chatEl.querySelectorAll('.msg'));
      for(let i=1;i<nodes.length;i++) nodes[i].remove();
      scrollToBottom();
    });

    // 初始化即把当前会话 ID 写入检索遥测侧栏底部（避免未发问前显示「—」）
    (function(){
      const railSession = document.getElementById('railSession');
      if(railSession) railSession.textContent = sessionId;
    })();
    apiHealth();
    setInterval(apiHealth, 5000);
    loadHistory();
    setTimeout(() => inputEl.focus(), 200);

    // 全局搜索落地：若从应用栏搜索跳转而带 ?q= 参数，则预填输入框并自动发起提问
    // 让顶栏搜索框成为真正的全局入口，而非仅跳转到一个空页面。
    (function () {
      try {
        const params = new URLSearchParams(location.search);
        const q = (params.get('q') || '').trim();
        if (!q) return;
        inputEl.value = q;
        autoGrow();
        const hero = chatEl.querySelector('.chat-hero');
        if (hero && hero.parentNode) hero.remove();
        onSend();
      } catch (e) { /* 解析失败不影响正常打开页面 */ }
    })();
  </script>
  <script>
    // 空状态交互：发起提问后隐藏 Hero；点击推荐问题直接发起提问
    (function () {
      var chat = document.getElementById('chat');
      var send = document.getElementById('send');
      var input = document.getElementById('input');
      if (!chat) return;
      var hero = chat.querySelector('.chat-hero');
      function hideHero() {
        if (hero && hero.parentNode) {
          hero.style.opacity = '0';
          hero.style.transform = 'translateY(-8px)';
          setTimeout(function () { if (hero.parentNode) hero.remove(); }, 220);
        }
      }
      if (send) send.addEventListener('click', hideHero);
      if (input) input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) hideHero();
      });
      if (chat.querySelectorAll('.msg').length) hideHero();
      var chips = chat.querySelectorAll('.chip-sug');
      Array.prototype.forEach.call(chips, function (c) {
        c.addEventListener('click', function () {
          if (input) {
            input.value = c.getAttribute('data-q') || c.textContent;
            if (send) send.click();
          }
        });
      });
    })();
  </script>
</body>
