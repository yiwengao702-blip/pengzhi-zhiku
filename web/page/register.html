<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>注册 · 鹏至智库</title>
  <link rel="stylesheet" href="assets/css/theme.css?v=20261017" />
  <link rel="stylesheet" href="assets/css/login.css?v=20261018" />
  <script>
    (function(){
      try{
        if(localStorage.getItem('kb_theme')==='dark') document.documentElement.setAttribute('data-theme','dark');
      }catch(e){}
    })();
  </script>
</head>
<body class="login-page">
  <div class="login-wrap">
    <aside class="login-hero">
      <div class="login-hero__brand">
        <span class="login-hero__logo">鹏</span>
        <div>
          <div class="login-hero__name">鹏至智库</div>
          <div class="login-hero__tag">企业知识中枢</div>
        </div>
      </div>
      <h1 class="login-hero__title">创建企业账号<br>开启知识中枢之旅</h1>
      <ul class="login-hero__feats">
        <li>汇聚文档、制度与知识资产，一键导入</li>
        <li>基于企业文档的自然语言问答与溯源</li>
        <li>知识规模、类型分布与动态全貌洞察</li>
      </ul>
      <div class="login-hero__env">内部系统 · 测试环境</div>
    </aside>

    <main class="login-card">
      <div class="login-card__head">
        <h2>注册账号</h2>
        <p>填写以下信息，创建您的企业知识库账号</p>
      </div>

      <form id="regForm" class="login-form" autocomplete="off">
        <label class="login-field">
          <span class="login-field__label">姓名（选填）</span>
          <span class="login-field__box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            <input id="name" type="text" placeholder="用于展示的昵称" />
          </span>
        </label>

        <label class="login-field">
          <span class="login-field__label">企业邮箱</span>
          <span class="login-field__box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            <input id="email" type="email" placeholder="name@company.com" />
          </span>
        </label>

        <label class="login-field">
          <span class="login-field__label">密码</span>
          <span class="login-field__box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input id="pass" type="password" placeholder="至少 6 位字符" />
            <button type="button" id="togglePass" class="login-field__eye" aria-label="显示密码">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </span>
        </label>

        <label class="login-field">
          <span class="login-field__label">确认密码</span>
          <span class="login-field__box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
            <input id="pass2" type="password" placeholder="再次输入密码" />
          </span>
        </label>

        <div class="login-err" id="regErr" hidden></div>

        <button type="submit" class="login-submit">注 册</button>
      </form>

      <div class="login-foot">
        已有账号？<a class="login-link" href="/login.html?v=20261013">去登录</a>
      </div>
    </main>
  </div>

  <script>
    // 注册逻辑（前端演示，账号仅存于浏览器 localStorage，非安全后端存储）
    (function () {
      var SERVICES = window.KB_SERVICES || { import: location.protocol + "//" + location.hostname + ":8100", query: location.protocol + "//" + location.hostname + ":8111" };
      var VER = "20261013";

      function getLogin() {
        try { return localStorage.getItem('kb_logged_in') || sessionStorage.getItem('kb_logged_in'); }
        catch (e) { return null; }
      }
      function getAccounts() {
        try { return JSON.parse(localStorage.getItem('kb_accounts') || '[]'); }
        catch (e) { return []; }
      }
      function go(url) { location.href = url; }
      // 演示用：明文密码做轻量编码（非加密，仅避免直接明文暴露；禁用于生产）
      function enc(p) { return btoa(unescape(encodeURIComponent(p))); }

      var params = new URLSearchParams(location.search);
      var next = params.get('next');

      if (getLogin()) { go(next ? next : (SERVICES.import + "/?v=" + VER)); return; }

      var form = document.getElementById('regForm');
      var errEl = document.getElementById('regErr');
      var toggle = document.getElementById('togglePass');
      var nameEl = document.getElementById('name');
      var emailEl = document.getElementById('email');
      var passEl = document.getElementById('pass');
      var pass2El = document.getElementById('pass2');

      toggle.addEventListener('click', function () {
        var show = passEl.type === 'password';
        passEl.type = show ? 'text' : 'password';
        pass2El.type = passEl.type; // 同步确认框
        toggle.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var name = (nameEl.value || '').trim();
        var email = (emailEl.value || '').trim();
        var p = passEl.value || '';
        var p2 = pass2El.value || '';

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { errEl.textContent = '请输入有效的企业邮箱'; errEl.hidden = false; return; }
        if (p.length < 6) { errEl.textContent = '密码至少 6 位字符'; errEl.hidden = false; return; }
        if (p !== p2) { errEl.textContent = '两次输入的密码不一致'; errEl.hidden = false; return; }

        var accounts = getAccounts();
        if (accounts.some(function (a) { return a.email === email; })) {
          errEl.textContent = '该邮箱已注册，请直接登录'; errEl.hidden = false; return;
        }

        accounts.push({ email: email, name: name, pass: enc(p) });
        try { localStorage.setItem('kb_accounts', JSON.stringify(accounts)); } catch (e) {}

        // 注册成功自动登录并进入系统（邮箱作为登录标识，姓名用于展示）
        try { localStorage.setItem('kb_logged_in', JSON.stringify({ user: email, name: name, ts: Date.now() })); } catch (e) {}
        errEl.hidden = true;
        go(next ? next : (SERVICES.import + "/?v=" + VER));
      });
    })();
  </script>
</body>
</html>
