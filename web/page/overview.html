  <script>
  /* 主题防闪烁：在 <body> 绘制前根据 localStorage 预设 data-theme */
  (function(){
    var STORE='kb_theme';
    function getTheme(){ return document.documentElement.getAttribute('data-theme')==='dark' ? 'dark' : 'light'; }
    function setTheme(t){
      if(t==='dark') document.documentElement.setAttribute('data-theme','dark');
      else document.documentElement.removeAttribute('data-theme');
      try{ localStorage.setItem(STORE,t); }catch(e){}
    }
    try{ if(localStorage.getItem(STORE)==='dark') document.documentElement.setAttribute('data-theme','dark'); }catch(e){}
    function toggleTheme(){ setTheme(getTheme()==='dark' ? 'light' : 'dark'); }
    document.addEventListener('DOMContentLoaded',function(){
      var b=document.getElementById('themeToggle');
      if(b){
        b.addEventListener('click', function(e){ e.preventDefault(); toggleTheme(); });
        b.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleTheme(); } });
      }
    });
    window.__toggleTheme = toggleTheme;
  })();
  </script>

  <script>
    // 概览页统计：从导入服务 /stats 拉取真实指标并渲染（替换原写死 mock）。
    (function () {
      var API = (window.KB_SERVICES && window.KB_SERVICES.import) || "http://127.0.0.1:8100";
      var banner = document.getElementById('statsBanner');

      function fmtTime(ts) {
        if (!ts) return '—';
        var d = new Date(ts * 1000);
        function p(n){ return (n < 10 ? '0' : '') + n; }
        return (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
      }
      function showError(msg) {
        if (!banner) return;
        banner.hidden = false;
        banner.textContent = '⚠ 统计加载失败：' + msg + '（请确认导入服务 ' + API + ' 正在运行）';
      }
      function setText(id, v) { var el = document.getElementById(id); if (el) el.textContent = v; }
      function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];
        });
      }
      // 类型彩色 chip：颜色取自前端 PALETTE（与「文档类型分布」环形图配色统一），
      // 通过 CSS 变量 --c 注入，未命中时回退中性灰。
      function typeChip(t) {
        var color = PALETTE[t] || '#8a9ab0';
        return '<span class="type-chip" style="--c:' + color + '">' + escapeHtml(t || '—') + '</span>';
      }

      var PALETTE = { 'PDF':'#d05a4f','Markdown':'#36a878','Word':'#2f6fb0','DOC':'#2f6fb0','DOCX':'#2f6fb0','Excel':'#2c8f66','XLS':'#2c8f66','PPT':'#c2872f','其他':'#8a9ab0' };

      function render(data) {
        if (!data || data.error) { showError(data && data.error ? data.error : '未知错误'); return; }
        if (banner) banner.hidden = true;

        var total = data.total_docs || 0;
        var completed = data.completed_docs || 0;
        var chunks = data.total_chunks || 0;
        setText('stat-total', total);
        setText('stat-total-trend', '已解析 ' + completed + ' 篇');
        setText('stat-chunks', chunks);
        var cov = total > 0 ? Math.round(completed / total * 100) : 0;
        setText('stat-chunks-trend', '▲ 完成率 ' + cov + '%');
        setText('stat-processing', data.processing || 0);
        var pt = document.getElementById('stat-processing-trend');
        if ((data.processing || 0) > 0) { setText('stat-processing-trend', '● 正在处理'); pt.classList.remove('down'); }
        else { setText('stat-processing-trend', '● 队列正常'); pt.classList.add('down'); }
        setText('stat-storage', data.storage || '—');
        setText('stat-storage-trend', 'doc/ 目录占用');

        // 最近导入（表格）
        var recent = Array.isArray(data.recent) ? data.recent : [];
        var rl = document.getElementById('recent-list');
        if (recent.length === 0) {
          rl.innerHTML = '<tr><td colspan="5" style="color:var(--muted)">暂无导入记录</td></tr>';
        } else {
          rl.innerHTML = recent.map(function (d) {
            var badge = d.completed
              ? '<span class="badge done">已完成</span>'
              : '<span class="badge wait">待处理</span>';
            return '<tr>'
              + '<td><div class="doc-name" title="' + escapeHtml(d.name) + '">' + escapeHtml(d.name) + '</div></td>'
              + '<td>' + typeChip(d.type) + '</td>'
              + '<td class="mono">' + escapeHtml(d.size || '—') + '</td>'
              + '<td>' + badge + '</td>'
              + '<td class="mono">' + fmtTime(d.mtime) + '</td>'
              + '</tr>';
          }).join('');
        }

        // 文档类型分布（环形图 + 图例）
        var dist = data.type_distribution || {};
        var keys = Object.keys(dist);
        var sum = keys.reduce(function (a, k) { return a + (dist[k] || 0); }, 0);
        var donut = document.getElementById('dist-donut');
        var legend = document.getElementById('dist-legend');
        setText('dist-total', total);
        if (sum === 0) {
          donut.style.background = '#e6ebf2';
          legend.innerHTML = '<div class="legend__row" style="color:var(--muted)">暂无数据</div>';
        } else {
          var stops = [], acc = 0;
          keys.forEach(function (k) {
            var pct = Math.round(dist[k] / sum * 100);
            var color = PALETTE[k] || '#8a9ab0';
            stops.push(color + ' ' + acc + '% ' + (acc + pct) + '%');
            acc += pct;
          });
          donut.style.background = 'conic-gradient(' + stops.join(',') + ')';
          legend.innerHTML = keys.map(function (k) {
            var color = PALETTE[k] || '#8a9ab0';
            return '<div class="legend__row"><span class="legend__dot" style="background:' + color + '"></span>'
              + '<span class="legend__name">' + escapeHtml(k) + '</span>'
              + '<span class="legend__val">' + dist[k] + '</span></div>';
          }).join('');
        }
        var foot = document.getElementById('dist-foot');
        if (foot) foot.textContent = '数据更新于 ' + (data.updated_at || '—') + ' · 共 ' + total + ' 篇文档';
      }

      function load() {
        fetch(API + '/stats', { cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(render)
          .catch(function (e) { showError(e.message || String(e)); });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', load);
      } else { load(); }

      var btn = document.getElementById('refreshStats');
      if (btn) btn.addEventListener('click', load);
      setInterval(load, 30000);
    })();
  </script>
