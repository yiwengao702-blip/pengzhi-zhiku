  <script>
  /* 主题防闪烁：在 <body> 绘制前根据 localStorage 预设 data-theme */
  (function(){
    var STORE='kb_theme';
    function getTheme(){ return document.documentElement.getAttribute('data-theme')==='dark' ? 'dark' : 'light'; }
    function setTheme(t){
      if(t==='dark') document.documentElement.setAttribute('data-theme','dark');
      else document.documentElement.removeAttribute('data-theme');
      try{ localStorage.setItem(STORE,t); }catch(e){}
    }
    try{ if(localStorage.getItem(STORE)==='dark') document.documentElement.setAttribute('data-theme','dark'); }catch(e){}
    function toggleTheme(){ setTheme(getTheme()==='dark' ? 'light' : 'dark'); }
    document.addEventListener('DOMContentLoaded',function(){
      var b=document.getElementById('themeToggle');
      if(b){
        b.addEventListener('click', function(e){ e.preventDefault(); toggleTheme(); });
        b.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleTheme(); } });
      }
    });
    window.__toggleTheme = toggleTheme;
  })();
  </script>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');

    // 后端基地址：从全局配置读取导入服务地址（与 .env 的 KB_PORT_IMPORT=8100 一致）。
    const API_BASE = window.KB_SERVICES.import;

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '#ecf6fd';
    });

    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '';
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '';
        handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
    });

    function handleFiles(files) {
        Array.from(files).forEach(uploadFile);
    }

    function fileExt(name){
      const m = String(name||'').split('.');
      return (m.length > 1 ? m.pop() : '').toUpperCase();
    }

    // 读取当前登录用户作为「操作人」：昵称优先，回退邮箱；未登录则显示「未登录」
    function getCurrentOperator() {
      try {
        const raw = localStorage.getItem('kb_logged_in') || sessionStorage.getItem('kb_logged_in');
        if (!raw) return '未登录';
        const info = JSON.parse(raw);
        return (info.name && String(info.name).trim()) || info.user || '未登录';
      } catch (e) { return '未登录'; }
    }

    function updateProgressBar(bar, percentage) {
        bar.style.width = percentage + '%';
        if (percentage >= 100) {
            bar.style.backgroundColor = '#3498db';
        } else {
            bar.style.backgroundColor = '#f39c12';
        }
    }

    async function uploadFile(file) {
        const id = 'file-' + Math.random().toString(36).substr(2, 9);
        const ext = fileExt(file.name);
        const operator = getCurrentOperator();
        const html = `
            <div class="file-item" id="${id}">
                <div class="file-info">
                    <span class="file-name">${file.name}</span>
                    <span class="file-size">${(file.size / 1024).toFixed(2)} KB</span>
                    <div class="progress-bar-container">
                        <div class="progress-bar"></div>
                    </div>
                    <details class="log-details">
                        <summary>日志（点击展开）</summary>
                        <ul class="log-list"></ul>
                    </details>
                </div>
                <div class="file-type">${ext || '—'}</div>
                <div class="file-time">刚刚</div>
                <div class="file-operator" title="${operator}">${operator}</div>
                <div class="file-status"><div class="status-badge status-uploading">上传中...</div></div>
                <div class="file-act"></div>
            </div>
        `;
        fileList.insertAdjacentHTML('afterbegin', html);
        const itemEl = document.getElementById(id);
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressBar = itemEl.querySelector('.progress-bar');
        const progressContainer = itemEl.querySelector('.progress-bar-container');

        const formData = new FormData();
        formData.append('files', file);

        try {
            progressContainer.style.display = 'block';
            updateProgressBar(progressBar, 50);

            let response;
            try {
                response = await fetch(`${API_BASE}/upload`, {
                    method: 'POST',
                    body: formData
                });
            } catch (netErr) {
                throw new Error(
                    `无法连接后端导入服务 ${API_BASE}（${netErr.message}）。` +
                    `请确认已在项目根目录执行 python main.py 启动服务，并确保 ${API_BASE} 正在监听。`
                );
            }

            if (!response.ok) {
                let detail = '';
                try { detail = await response.text(); } catch (_) { }
                throw new Error(
                    `服务返回 HTTP ${response.status} ${response.statusText}` +
                    (detail ? `：${detail.slice(0, 500)}` : '')
                );
            }

            let result;
            try {
                result = await response.json();
            } catch (jsonErr) {
                throw new Error(`服务响应不是合法 JSON，可能连到了非本项目的服务：${jsonErr.message}`);
            }

            if (!result || !Array.isArray(result.task_ids) || result.task_ids.length === 0) {
                throw new Error(`服务未返回 task_ids，响应内容：${JSON.stringify(result).slice(0, 500)}`);
            }

            const taskId = result.task_ids[0];
            updateProgressBar(progressBar, 30);
            statusBadge.textContent = '处理中...';
            statusBadge.className = 'status-badge status-processing';
            pollStatus(taskId, itemEl);

        } catch (error) {
            console.error(error);
            statusBadge.textContent = '失败';
            statusBadge.className = 'status-badge status-error';
            renderErrorLog(itemEl, error && error.message ? error.message : String(error));
        }
    }

    function normalizeDoneLog(text) {
        if (typeof text !== 'string') return String(text);
        return text.endsWith('已完成') ? text : `${text}已完成`;
    }

    function normalizeRunningLog(text) {
        if (typeof text !== 'string') return String(text);
        if (text.startsWith('正在进行')) return text.endsWith('...') ? text : `${text}...`;
        return `正在进行${text}...`;
    }

    function renderLogs(itemEl, doneList, runningList) {
        const logSummary = itemEl.querySelector('.log-details summary');
        const logListEl = itemEl.querySelector('.log-list');
        const logDetails = itemEl.querySelector('.log-details');

        const done = Array.isArray(doneList) ? doneList : [];
        const running = Array.isArray(runningList) ? runningList : [];

        logSummary.textContent = `日志（已完成${done.length}，进行中${running.length}，点击展开）`;

        logListEl.innerHTML = '';
        const lines = [
            ...done.map(normalizeDoneLog),
            ...running.map(normalizeRunningLog),
        ];

        if (lines.length === 0) {
            const li = document.createElement('li');
            li.textContent = '暂无日志';
            logListEl.appendChild(li);
        } else {
            for (const line of lines) {
                const li = document.createElement('li');
                li.textContent = line;
                logListEl.appendChild(li);
            }
        }

        if (lines.length === 0) {
            logDetails.open = false;
        }
    }

    function renderErrorLog(itemEl, message) {
        const logSummary = itemEl.querySelector('.log-details summary');
        const logListEl = itemEl.querySelector('.log-list');
        const logDetails = itemEl.querySelector('.log-details');
        if (!logSummary || !logListEl) return;
        logSummary.textContent = '日志（失败原因，点击收起）';
        logListEl.innerHTML = '';
        const li = document.createElement('li');
        li.textContent = message;
        li.style.color = '#c0392b';
        li.style.wordBreak = 'break-all';
        logListEl.appendChild(li);
        if (logDetails) logDetails.open = true;
    }

    function pollStatus(taskId, itemEl) {
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressBar = itemEl.querySelector('.progress-bar');
        const timeEl = itemEl.querySelector('.file-time');

        const interval = setInterval(async () => {
            try {
                const res = await fetch(`${API_BASE}/status/${taskId}`);
                const data = await res.json();
                renderLogs(itemEl, data.done_list, data.running_list);
                if (timeEl) timeEl.textContent = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});

                if (data.status === 'completed') {
                    statusBadge.textContent = '已完成';
                    statusBadge.className = 'status-badge status-completed';
                    updateProgressBar(progressBar, 100);
                    clearInterval(interval);
                } else if (data.status === 'processing') {
                    statusBadge.textContent = '处理中...';
                    updateProgressBar(progressBar, 30);
                } else if (data.status === 'failed') {
                    statusBadge.textContent = '失败';
                    statusBadge.className = 'status-badge status-error';
                    renderErrorLog(itemEl, '后端处理失败：' + (data.error || '（后端未返回详细原因，请查看服务端日志）'));
                    clearInterval(interval);
                }
            } catch (e) {
                console.error('Polling error', e);
            }
        }, 2000);
    }

    (async function checkBackend() {
        const banner = document.getElementById('apiBanner');
        try {
            const r = await fetch(`${API_BASE}/health`, { cache: 'no-store' });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            if (banner) banner.hidden = true;
        } catch (e) {
            if (banner) {
                banner.hidden = false;
                banner.textContent = `⚠ 未能连接后端导入服务（${API_BASE}，${e.message}）。请在项目根目录执行 python main.py 启动服务后再导入。`;
            }
            console.warn('后端导入服务探活失败：', e);
        }
    })();
</script>
